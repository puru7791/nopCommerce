# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- develop

pool: 
 name: 'my-self-hosted'
 demands:
  - agent.name -equals myagent-01

variables:
  solution: '**/NopCommerce.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

  # SonarQube specific
  sonarProjectKey: 'nopCommerce'
  sonarProjectName: 'nopCommerce'
  sonarServiceConnection: 'SonarQube-server'

stages:
- stage: Build
  displayName: 'Build and Analyze'
  jobs:
  - job: Build
    displayName: 'Build Job'
    # pool:
    #   vmImage: 'windows-latest'

    steps:
    - task: SonarQubePrepare@5
      inputs:
        SonarQube: '$(sonarServiceConnection)'
        scannerMode: 'MSBuild'
        projectKey: '$(sonarProjectKey)'
        projectName: '$(sonarProjectName)'

    - task: NuGetToolInstaller@1

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: VSBuild@1
      inputs:
        solution: '$(solution)'
        msbuildArgs: '/p:DeployOnBuild=true'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: SonarQubeAnalyze@5

    - task: SonarQubePublish@5
      inputs:
        pollingTimeoutSec: '300'

    - task: CopyFiles@2
      inputs:
        Contents: '**\bin\$(buildConfiguration)\**'
        TargetFolder: '$(Build.ArtifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'drop'
        publishLocation: 'Container'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    displayName: 'Deploy nopCommerce to Azure App Service'
    environment: 'nopCommerce-env'
    # pool:
    #   vmImage: 'windows-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop

          - task: AzureWebApp@1
            inputs:
              azureSubscription: 'azure-ado-connection-2'
              appName: 'nopCommerce'
              package: '$(Pipeline.Workspace)/drop/**/*.zip'
              appType: webApp


